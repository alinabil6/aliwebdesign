name: Build & Release Desktop App

on:
  push:
    tags:
      - "v*"
  # Allow manual trigger from GitHub Actions tab for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # CI install: respects package-lock.json for reproducible builds.
      # The postinstall hook in package.json automatically runs
      # `electron-builder install-app-deps` which rebuilds better-sqlite3
      # and sharp against Electron's exact ABI — no separate step required.
      - name: Install Dependencies (with native module rebuild)
        run: npm ci

      # electron-builder handles packaging + GitHub Release upload in one command.
      # It also internally re-runs install-app-deps before packaging as a safety net.
      - name: Build & Publish Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always