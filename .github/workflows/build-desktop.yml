name: Build & Release Desktop App

on:
  push:
    tags:
      - "v*"
  # Allow manual trigger from GitHub Actions tab for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    env:
      # Playwright downloads ~300MB of browsers during npm install.
      # The packaged desktop app uses the system Chrome/Brave, not Playwright's
      # bundled browsers, so skip the download entirely to save time and bandwidth.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # Setup Python (required by node-gyp for compiling native C++ addons
      # like better-sqlite3 against Electron's specific ABI)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install dependencies but SKIP postinstall hook.
      # The postinstall runs electron-builder install-app-deps which can
      # fail in some environments. We handle native module rebuild explicitly
      # in the next step instead.
      - name: Install Dependencies
        run: npm ci --ignore-scripts

      # Explicitly rebuild native C++ modules (better-sqlite3, sharp)
      # against Electron's exact Node ABI version.
      - name: Rebuild Native Modules for Electron
        run: npx electron-builder install-app-deps

      # electron-builder handles packaging + GitHub Release upload.
      # npmRebuild:true in electron-builder.yml provides a safety-net rebuild.
      - name: Build & Publish Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always