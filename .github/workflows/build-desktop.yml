name: Build & Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      # On macOS, install the Intel x64 sharp prebuilt alongside the Apple Silicon arm64 one
      # so electron-builder can package both architectures without compiling from source.
      - name: Install macOS x64 sharp prebuilt (macOS only)
        if: runner.os == 'macOS'
        run: npm install --os=darwin --cpu=x64 @img/sharp-darwin-x64 --no-save

      # electron-builder packages using bundled prebuilt binaries (better-sqlite3 & sharp)
      # without invoking @electron/rebuild or node-gyp, then publishes directly to GitHub Releases.
      - name: Build & Publish Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always