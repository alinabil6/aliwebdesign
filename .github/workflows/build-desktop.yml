name: Build & Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      GYP_MSVS_VERSION: "2022"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      # Nuclear fix: force-replace EVERY copy of node-gyp in the entire
      # node_modules tree with the latest version that can detect VS2022.
      # The old node-gyp 9.x nested inside @electron/rebuild cannot find
      # Visual Studio on GitHub's windows-latest runners.
      - name: Force-upgrade all node-gyp copies (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Installing latest node-gyp..."
          npm install node-gyp@latest --no-save
          $latestGyp = Join-Path (Get-Location) "node_modules/node-gyp"
          Get-ChildItem -Path "node_modules" -Recurse -Directory -Filter "node-gyp" |
            Where-Object { $_.FullName -ne (Resolve-Path $latestGyp).Path } |
            ForEach-Object {
              Write-Host "  Replacing: $($_.FullName)"
              Remove-Item $_.FullName -Recurse -Force
              Copy-Item $latestGyp $_.FullName -Recurse
            }
          Write-Host "All node-gyp copies upgraded."

      - name: Rebuild Native Modules for Electron
        run: npx electron-builder install-app-deps

      - name: Build & Publish Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always