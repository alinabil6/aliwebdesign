name: Build & Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Draft Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Ensure single draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --draft \
              --title "${TAG#v}" \
              --notes "Magic Fabrica Studio $TAG"
          fi

  release:
    name: Build (${{ matrix.os }})
    needs: prepare-release
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      # On macOS, install the Intel x64 sharp prebuilt alongside the Apple Silicon arm64 one
      # using --force to bypass npm's CPU architecture check on the arm64 runner.
      - name: Install macOS x64 sharp prebuilt (macOS only)
        if: runner.os == 'macOS'
        run: npm install --force --os=darwin --cpu=x64 @img/sharp-darwin-x64 --no-save

      # electron-builder packages using bundled prebuilt binaries (better-sqlite3 & sharp)
      # and uploads into the single draft release so half-uploaded tags are never exposed.
      - name: Build & Upload Draft Assets to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: "true"
        run: npx electron-builder --publish always

  publish-release:
    name: Publish Complete Release
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Verify All Platform Manifests & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          echo "Uploaded assets:"
          echo "$assets"
          echo "$assets" | grep -qx "latest.yml"
          echo "$assets" | grep -qx "latest-mac.yml"
          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest