appId: com.magicfabrica.studio
productName: Magic Fabrica Studio
copyright: Copyright © 2026 Magic Fabrica

directories:
  output: dist
  buildResources: build

files:
  - "**/*"
  - "!dist/**"
  - "!**/*.ts"
  - "!**/*.map"
  - "!scripts/**"
  - "!.git/**"
  - "!.github/**"
  - "!profiles/**"
  - "!library/**"
  - "!tmp/**"
  - "!*.db*"
  - "!*.log"
  - "!etsy_commit_diff.txt"
  - "!how 5641f262"
  - "!magicListing_at_5641f262.js"

asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/better-sqlite3/**/*"
  - "node_modules/sharp/**/*"
  - "node_modules/@img/**/*"

extraMetadata:
  main: "electron/main.js"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: frontend/favicon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Magic Fabrica Studio
  runAfterFinish: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  icon: frontend/favicon.png
  category: public.app-category.graphics-design
  hardenedRuntime: true
  gatekeeperAssess: false

publish:
  provider: github
  owner: alinabil6
  repo: aliwebdesign
  releaseType: release
